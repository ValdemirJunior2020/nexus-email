services:
  - type: web
    name: nexus-email-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHEET_ID
        value: 1nxmEvfWe6WcdUX2Wcc3TQ06oMVWz6LMGTtgXwEmDCog
      - key: MAILBOX
        value: nexusai.helpdesk@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: INBOUND_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
